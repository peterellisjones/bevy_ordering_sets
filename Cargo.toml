[package]
name = "bevy_ordering_sets"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Declarative data-flow system ordering for Bevy — order systems by the data they read and write, not by hand-written .before()/.after() chains"
readme = "README.md"
repository = "https://github.com/peterellisjones/bevy_ordering_sets"
keywords = ["bevy", "gamedev", "ecs", "scheduling"]
categories = ["game-development"]

[dependencies]
bevy = { version = "0.19", default-features = false }

[features]
default = []
# Record every `register_data_flow` call in a `DataFlowRegistry` resource for
# schedule-introspection tooling. Off by default (adds per-registration
# bookkeeping); enable it only in the consumer that needs the audit. Recording
# only — the `Writes<T>` → `Reads<T>` ordering is identical with or without it.
registry = []
