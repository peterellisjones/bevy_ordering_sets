[package]
name = "bevy_ordering_sets"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Declarative data-flow system ordering for Bevy — order systems by the data they read and write, not by hand-written .before()/.after() chains"
readme = "README.md"
repository = "https://github.com/peterellisjones/bevy_ordering_sets"
keywords = ["bevy", "gamedev", "ecs", "scheduling"]
categories = ["game-development"]

[dependencies]
bevy = { version = "0.18", default-features = false }

[features]
default = []
